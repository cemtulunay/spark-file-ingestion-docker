name: CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies (dev)
        run: |
          python -m pip install --upgrade pip
          # If you have a requirements-dev.txt, use it; otherwise install pytest directly
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install pytest
          fi

          # Install the package (so imports work in tests)
          pip install -e .

      - name: Run tests
        run: pytest -q

      - name: Build wheel
        run: |
          pip install build
          # python -m build --wheel
          python -m build --wheel --output ./dist/ .

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-dist
          path: dist/*.whl

  deploy_databricks_bundle:
    # This job is optional: it only runs if you set DATABRICKS_HOST and DATABRICKS_TOKEN
    needs: test_build
    runs-on: ubuntu-latest
    if: ${{ secrets.DATABRICKS_HOST != '' && secrets.DATABRICKS_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheel-dist
          path: dist

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Configure Databricks auth
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks auth env --host "$DATABRICKS_HOST" --token "$DATABRICKS_TOKEN"

      - name: Validate bundle
        run: databricks bundle validate

      - name: Deploy bundle (dev target)
        run: databricks bundle deploy -t dev

      # Optional: run the job after deploy (uncomment if you want CD to execute it)
      # - name: Run job
      #   run: databricks bundle run -t dev f1_lap_times_job